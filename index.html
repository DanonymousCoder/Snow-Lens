<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 
        Link to CSS
    -->

    <link rel="stylesheet" href="./assets/styles/styles.css">

    <!-- 
        Link to Leaflet CSS
    -->

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>

     
    <title>Snow Lens</title>
</head>
<body>
    <div class="container">
        <header>
            <nav>
                <div class="logo">
                    <h1>Snow lens</h1>
                </div>

                <ul class="nav-links">
                    <li><a href="#" id="favourites-link">Favourites(<span id="favourites-count">0</span>)</a></li>
                </ul>
            </nav>

            <div class="hero">
                <div class="text">
                    <h1>Winter travel planner</h1>
                    <p class="sub">Discover the perfect winter destination</p>

                    <div class="types">
                        <a href="#" class="snow type-active" data-theme="snow">Snow</a>
                        <a href="#" class="aurora" data-theme="aurora">Aurora</a>
                        <a href="#" class="frost" data-theme="frost">Frost</a>
                    </div>
                </div>
                
                <div class="input-section">
                    <input type="text" placeholder="Search for a winter destination" id="city-search" autocomplete="off">

                    <div class="suggestions hidden" id="suggestions"></div>
                </div>

            </div>
        </header>

        <main class="hidden" id="content">
            <div class="main-grid">
                <div class="glass weather-card">
                    <div class="weather-content" id="weather-content">
                        
                    </div>
                </div>

                <div class="glass">
                    <h2>Location</h2>
                    <div id="map"></div>
                </div>
            </div>

            <div class="gallery glass" id="gallerysection">

            </div>

            <div class="glass plan">
                <h2>Plan your trip</h2>
                <div class="action-buttons">
                    <button onclick="app.generateTripPlan()">Generate trip plan</button>
                    <button id="favourite-btn" onclick="app.toggleFavourite()">
                        <span id="favourite-text">
                            Add to favourites
                        </span>
                    </button>
                </div>
            </div>

            <div class="modal" id="trip-modal">
                <div class="modal-content">
                    <span class="modal-close" onclick="app.closeModal()">&times;</span>
                    <div class="trip-plan" id="trip-plan">

                    </div>
                </div>
            </div>
        </main>
    </div>



    <!-- 
        Link to JS
    -->

    <script src="env.js"></script>
    <script src="script.js"></script>

    <!-- Make sure you put this AFTER Leaflet's CSS -->
 <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
</body>
</html>
