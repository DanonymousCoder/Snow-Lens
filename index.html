<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 
        Link to CSS
    -->

    <link rel="stylesheet" href="./assets/styles/styles.css">

    <title>Snow Lens</title>
</head>
<body>
    <div class="container">
        <header>
            <nav>
                <div class="logo">
                    <h1>Snow lens</h1>
                </div>

                <ul class="nav-links">
                    <li><a href="#">Favourites(0)</a></li>
                </ul>
            </nav>

            <div class="hero">
                <div class="text">
                    <h1>Winter travel planner</h1>
                    <p class="sub">Discover the perfect winter destination</p>

                    <div class="types">
                        <a href="#" class="snow type-active">Snow</a>
                        <a href="#" class="aurora">Aurora</a>
                        <a href="#" class="frost">Frost</a>
                    </div>
                </div>
                
                <div class="input-tag">
                    <input type="text" placeholder="Search for a winter destination">
                </div>

            </div>
        </header>

        <main>
            <div class="main-grid">
                <div>
                    <div></div>
                </div>

                <div>
                    <h2>Location</h2>
                    <div id="map"></div>
                </div>
            </div>

            <div>

            </div>

            <div>
                <h2>Plan your trip</h2>
                <div>
                    <button>Generate trip plan</button>
                    <button>
                        <span>
                            Add to favourites
                        </span>
                    </button>
                </div>
            </div>
        </main>
    </div>



    <!-- 
        Link to JS
    -->

    <script src="script.js"></script>
</body>
</html>
